<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>ETS</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<header>
			<div class="logo">
				<h1>MONEY MANAGEMENT</h1>
			</div>
			<!-- <div></div>
			<div class="link-group">
				<div class="link">tes</div>
				<div class="link">tes</div>
			</div> -->
		</header>

		<main>
			<div class="card card-hero">
				<div class="balance">
					<h1>Rp1.000</h1>
					<div class="balance-details">
						<p>+ Rp.total pemasukan</p>
						<p>- Rp.total pengeluaran</p>
					</div>
				</div>
			</div>
			<div class="card card-amplop">
				<div class="card-nav">
					<h1>AMPLOP</h1>
					<button class="btn tambah-amplop">
						<p>+ Tambah Amplop</p>
					</button>
				</div>
				<div class="amplops">
					<div class="amplop amplop-1">
						<h3>Amplop 1</h3>
						<div class="amplop-balance">
							<h1>Rp1.000</h1>
						</div>
					</div>
					<div class="amplop amplop-2">
						<h3>Amplop 2</h3>
						<div class="amplop-balance">
							<h1>Rp1.000</h1>
						</div>
					</div>
					<div class="amplop amplop-3">
						<h3>Amplop 3</h3>
						<div class="amplop-balance">
							<h1>Rp1.000</h1>
						</div>
					</div>
				</div>
			</div>
			<div class="card card-log">
				<div class="card-nav">
					<h1>PENGELUARAN</h1>
					<button class="btn tambah-transaksi">
						<p>+ Tambah Transaksi</p>
					</button>
				</div>
				<div class="tabel-log">
					<table class="tabel-transaksi">
						<thead>
							<tr>
								<th>Tanggal</th>
								<th>Jenis</th>
								<th>Kategori</th>
								<th>Catatan</th>
								<th>Nominal</th>
								<th>Actions</th>
							</tr>
						</thead>
						<tbody id="daftar-transaksi"></tbody>
					</table>
				</div>
			</div>

			<!-- POP-UP -->

			<dialog id="modal-amplop" class="modal">
				<div class="modal-header">
					<h2>Atur / Tambah Amplop</h2>
					<button type="button" id="btn-tutup-amplop" class="btn-close">&times;</button>
				</div>

				<form id="form-amplop">
					<div class="form-group">
						<label for="nama-amplop">Nama Pos / Amplop</label>
						<input type="text" id="nama-amplop" placeholder="Contoh: Belanja Dapur, Uang Sekolah" required />
					</div>

					<div class="form-group">
						<label for="jatah-amplop">Nominal Jatah Awal Bulan (Rp)</label>
						<input type="number" id="jatah-amplop" placeholder="Contoh: 1500000" min="1" required />
					</div>

					<div class="modal-actions">
						<button type="button" id="btn-batal-amplop" class="btn btn-secondary">Batal</button>
						<button type="submit" class="btn btn-primary">Simpan Amplop</button>
					</div>
				</form>
			</dialog>

			<dialog id="modal-transaksi" class="modal">
				<div class="modal-header">
					<h2>Tambah Transaksi</h2>
					<button type="button" id="btn-tutup-transaksi" class="btn-close">&times;</button>
				</div>

				<form id="form-transaksi">
					<div class="form-group">
						<label for="tgl-transaksi">Tanggal</label>
						<input type="date" id="tgl-transaksi" required />
					</div>

					<div class="form-group">
						<label for="jenis-transaksi">Jenis Transaksi</label>
						<select id="jenis-transaksi">
							<option value="pengeluaran">Pengeluaran</option>
							<option value="pemasukan">Pemasukan</option>
						</select>
					</div>

					<div class="form-group">
						<label for="kategori-transaksi">Kategori / Amplop Terkait</label>
						<select id="kategori-transaksi">
							<option value="Belanja Dapur">Belanja Dapur</option>
							<option value="Listrik & Air">Listrik & Air</option>
							<option value="Pendidikan Anak">Pendidikan Anak</option>
							<option value="Lain-lain">Lain-lain</option>
						</select>
					</div>

					<div class="form-group">
						<label for="nominal-transaksi">Nominal (Rp)</label>
						<input type="number" id="nominal-transaksi" placeholder="Contoh: 50000" min="1" required />
					</div>

					<div class="form-group">
						<label for="catatan-transaksi">Catatan (Opsional)</label>
						<input type="text" id="catatan-transaksi" placeholder="Contoh: Beli beras" />
					</div>

					<div class="modal-actions">
						<button type="button" id="btn-batal-transaksi" class="btn btn-secondary">Batal</button>
						<button type="submit" class="btn btn-primary">Simpan Transaksi</button>
					</div>
				</form>
			</dialog>
		</main>

		<footer></footer>

		<script src="script.js" defer></script>
	</body>
</html>
